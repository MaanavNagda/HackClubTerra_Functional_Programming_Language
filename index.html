<!DOCTYPE html>
<html>
    <head>
        <title>
            Tau
        </title>
        <!-- Pyodide is CPython that is compiled to WebAssembly, and allows you to run real python in the browser, without needing an actual server-->
        <script src="https://cdn.jsdelivr.net/pyodide/v314.0.7/full/pyodide.js"></script>
    </head>
    <body>
        <h1>
            Tau Web Playground
        </h1>
        <textarea id="code" rows="10" cols="60"> let x = 5 
            x + 3
        </textarea>
        <br>
        <!--This temporarily disables the run button, until the runtime pacakge has finished downloading (which shouldn't be too long as it is only like 10 megs). This is necessary as otherwise users WILL click run too early-->
        <button id="run" disabled>Run</button>
        <!--Friendly message so the user knows the system is working as expected, and hasn't just crashed-->
        <div id = "loading"> loading Python runtime...</div>
        <pre id="output"></pre>
        
        <!--module allows the top level await-->
        <script type="module">

            //downloads aand boots the python runtime, which may be a bit slow, but is a one time thing only
            const pyodide = await loadPyodide();
            
            //copies the files of the programming language into the Pyodide virtual file system, so the inter-file relations and imports work as expected
            const files = ["src/__init__.py", "src/tokens.py", "src/lexer.py", "src/ast_nodes.py", "src/parser.py", "src/evaluator.py"]
            pyodide.FS.mkdirTree("/home/pyodide/src")
            
            //fetch text
            for (const path of files) {
                const response = await fetch(path);
                const text = await response.text();
                pyodide.FS.writeFile("/home/pyodide/" + path, text);
            }
            
            //This is a test to prove that the lexer really did run in the browser, by outputting 5 to the developer console. Also checks that it is THIS lexer than ran, and not another lexer, by having the output number be a count of the number of tokens generated by the lexer, which likely varies from language to language
            await pyodide.runPythonAsync(`
            from src.lexer import Lexer
            print(len(Lexer("let x = 5").tokenize()))`);
            console.log(pyodide.runPython("1+1")); //expect 2
            
            //only enables run when everything is mounted and verified
            document.getElementById("run").disabled = false;
            document.getElementById("loading").hidden=true;
            document.getElementById("run").addEventListener("click", async () => {
                console.log("run clicked")
                try {
                    //push the editor's text into Python's global namespace
                    pyodide.globals.set("user_source", document.getElementById("code").value);
                    //runPythonAsync returns the LAST expression's value, which is why it is wrapped in a _run(), as a bare try or an except is a statement, and so returns nothing
                    const result = await pyodide.runPythonAsync(`
                        def _run(src):
                            try:
                                from src.lexer import Lexer
                                from src.parser import Parser
                                from src.evaluator import run_program
                                ast = Parser(Lexer(user_source).tokenize()).parse_program()
                                return run_program(ast, {})[0]
                            except Exception as e:
                                return str(e)
                        _run(user_source)
                    `);
                    //shows the result, or the error message on the page beneath the input box
                    document.getElementById("output").textContent  = result;
                } catch (err) {
                    console.log("handler error:", err.message);
                }
            });
        </script>
    </body>
</html>
